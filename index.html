<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>N-Puzzle Deluxe — Sliding Number Puzzle</title>
  <style>
    :root {
      --grid-size: 3;
      --grid-gap: 6px;
      --tile-radius: 8px;
      --font-main: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;

      /* Classic Wood Theme (Default) */
      --bg-outer: radial-gradient(circle at center, #6b3e20 0%, #3d200d 100%);
      --bg-pattern: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.015) 0px,
        rgba(255, 255, 255, 0.015) 2px,
        transparent 2px,
        transparent 8px
      );
      --hud-bg: linear-gradient(180deg, #4e2a12 0%, #331a09 100%);
      --hud-border: #8c5830;
      --hud-text: #f9e3b4;
      --accent-color: #f6c453;

      --board-frame: linear-gradient(145deg, #9c5b27, #6e3b14);
      --board-frame-border: #b87339;
      --board-well: #261105;
      --board-well-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.85);

      --tile-bg: linear-gradient(145deg, #ebd0a4 0%, #d8b27c 55%, #c69a61 100%);
      --tile-border-top: rgba(255, 245, 225, 0.75);
      --tile-border-bottom: #8c5d2e;
      --tile-shadow: 0 4px 6px rgba(0, 0, 0, 0.55);
      --tile-text: #3d2310;
      --tile-correct-bg: linear-gradient(145deg, #f3dca8 0%, #e2bc7e 55%, #cfa05a 100%);
      --tile-correct-dot: #8c5319;

      --pill-bg: linear-gradient(180deg, #4b270f 0%, #2d1607 100%);
      --pill-border: #c59356;
      --pill-text: #fff3d6;
    }

    /* Theme 2: Cyberpunk Neon */
    [data-theme="neon"] {
      --bg-outer: radial-gradient(circle at 50% 20%, #141836 0%, #070812 100%);
      --bg-pattern: repeating-linear-gradient(
        0deg,
        rgba(0, 243, 255, 0.03) 0px,
        rgba(0, 243, 255, 0.03) 1px,
        transparent 1px,
        transparent 24px
      );
      --hud-bg: rgba(14, 18, 38, 0.9);
      --hud-border: #00f3ff;
      --hud-text: #e0faff;
      --accent-color: #00f3ff;

      --board-frame: linear-gradient(145deg, #161b36, #0b0e1f);
      --board-frame-border: #ff007f;
      --board-well: #05060d;
      --board-well-shadow: inset 0 0 22px rgba(0, 243, 255, 0.25);

      --tile-bg: linear-gradient(145deg, #192142 0%, #10152b 100%);
      --tile-border-top: #00f3ff;
      --tile-border-bottom: #006680;
      --tile-shadow: 0 0 10px rgba(0, 243, 255, 0.28);
      --tile-text: #00f3ff;
      --tile-correct-bg: linear-gradient(145deg, #1b2f38 0%, #0f1f26 100%);
      --tile-correct-dot: #00ff88;

      --pill-bg: linear-gradient(180deg, #181f3d 0%, #0c1024 100%);
      --pill-border: #00f3ff;
      --pill-text: #ffffff;
    }

    /* Theme 3: Royal Gold & Obsidian */
    [data-theme="gold"] {
      --bg-outer: radial-gradient(circle at center, #242429 0%, #0d0d11 100%);
      --bg-pattern: none;
      --hud-bg: linear-gradient(180deg, #1f1f24 0%, #121216 100%);
      --hud-border: #d4af37;
      --hud-text: #fcedb4;
      --accent-color: #ffd700;

      --board-frame: linear-gradient(145deg, #2d2d35, #16161a);
      --board-frame-border: #d4af37;
      --board-well: #09090b;
      --board-well-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.95);

      --tile-bg: linear-gradient(145deg, #fae18c 0%, #d4af37 55%, #aa8010 100%);
      --tile-border-top: rgba(255, 255, 240, 0.85);
      --tile-border-bottom: #735404;
      --tile-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
      --tile-text: #1c1403;
      --tile-correct-bg: linear-gradient(145deg, #fff0b3 0%, #e5c148 55%, #b88c14 100%);
      --tile-correct-dot: #382800;

      --pill-bg: linear-gradient(180deg, #262216 0%, #141109 100%);
      --pill-border: #d4af37;
      --pill-text: #ffefb8;
    }

    /* Theme 4: Modern Frosted Glass */
    [data-theme="glass"] {
      --bg-outer: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a11cb 100%);
      --bg-pattern: none;
      --hud-bg: rgba(255, 255, 255, 0.14);
      --hud-border: rgba(255, 255, 255, 0.35);
      --hud-text: #ffffff;
      --accent-color: #7ef9ff;

      --board-frame: rgba(255, 255, 255, 0.16);
      --board-frame-border: rgba(255, 255, 255, 0.45);
      --board-well: rgba(10, 18, 40, 0.65);
      --board-well-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.45);

      --tile-bg: linear-gradient(145deg, rgba(255,255,255,0.32), rgba(255,255,255,0.14));
      --tile-border-top: rgba(255, 255, 255, 0.65);
      --tile-border-bottom: rgba(255, 255, 255, 0.18);
      --tile-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      --tile-text: #ffffff;
      --tile-correct-bg: linear-gradient(145deg, rgba(126, 249, 255, 0.38), rgba(126, 249, 255, 0.18));
      --tile-correct-dot: #7ef9ff;

      --pill-bg: rgba(15, 25, 55, 0.65);
      --pill-border: rgba(255, 255, 255, 0.5);
      --pill-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-main);
      background: var(--bg-outer);
      color: var(--hud-text);
      touch-action: manipulation;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100%;
      background-image: var(--bg-pattern);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(6px, 1.8vh, 16px) clamp(8px, 2.5vw, 20px);
    }

    /* TOP HUD */
    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--hud-bg);
      border: 1.5px solid var(--hud-border);
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    }

    .level-tag {
      font-weight: 800;
      font-size: clamp(0.82rem, 2.5vw, 1rem);
      letter-spacing: 0.5px;
      color: var(--accent-color);
    }

    .mode-badge {
      font-size: clamp(0.72rem, 2.2vw, 0.85rem);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .icon-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: var(--hud-bg);
      color: var(--hud-text);
      border: 1.5px solid var(--hud-border);
      border-radius: 10px;
      height: 36px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.35);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .icon-btn:active {
      transform: scale(0.93);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--hud-bg);
      border: 1.5px solid var(--hud-border);
      border-radius: 12px;
      padding: 5px 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.78;
      font-weight: 700;
    }

    .stat-value {
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--accent-color);
    }

    /* CENTER BOARD AREA */
    .board-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 4px 0;
    }

    .board-frame {
      position: relative;
      width: min(92vw, 66dvh, 520px);
      height: min(92vw, 66dvh, 520px);
      background: var(--board-frame);
      border: 3px solid var(--board-frame-border);
      border-radius: 16px;
      padding: clamp(10px, 2.6vmin, 18px);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.65),
        inset 0 2px 4px rgba(255, 255, 255, 0.28),
        inset 0 -4px 6px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .board-well {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--board-well);
      border-radius: 10px;
      box-shadow: var(--board-well-shadow);
      padding: var(--grid-gap);
      display: grid;
      grid-template-columns: repeat(var(--grid-size), 1fr);
      grid-template-rows: repeat(var(--grid-size), 1fr);
      gap: var(--grid-gap);
      touch-action: none;
    }

    /* PUZZLE TILES */
    .tile {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--tile-bg);
      border-radius: var(--tile-radius);
      border-top: 2px solid var(--tile-border-top);
      border-left: 2px solid var(--tile-border-top);
      border-right: 2px solid var(--tile-border-bottom);
      border-bottom: 3px solid var(--tile-border-bottom);
      box-shadow: var(--tile-shadow);
      color: var(--tile-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: var(--tile-font, 1.5rem);
      cursor: pointer;
      transition: transform 0.11s cubic-bezier(0.2, 0.9, 0.3, 1), filter 0.12s ease;
      overflow: hidden;
      touch-action: none;
    }

    /* Subtle wood grain texture overlay on Classic Wood theme */
    :root .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        85deg,
         rgba(120, 65, 20, 0.04) 0px,
        rgba(120, 65, 20, 0.04) 3px,
        transparent 3px,
        transparent 9px
      );
      pointer-events: none;
    }

    .tile.correct {
      background: var(--tile-correct-bg);
    }

    .tile.correct::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: clamp(3px, 0.8vmin, 6px);
      height: clamp(3px, 0.8vmin, 6px);
      border-radius: 50%;
      background: var(--tile-correct-dot);
      opacity: 0.75;
    }

    .tile:active {
      filter: brightness(1.08);
    }

    .tile-empty {
      width: 100%;
      height: 100%;
      border-radius: var(--tile-radius);
      pointer-events: none;
    }

    /* Hint Highlight & White Directional Arrow (Matching Reference Image) */
    .tile.hint-active {
      z-index: 5;
      animation: hintPulse 0.6s infinite alternate;
      outline: 3px solid #ffffff;
    }

    @keyframes hintPulse {
      0% { filter: brightness(1.05); transform: scale(0.97); }
      100% { filter: brightness(1.28); transform: scale(1.03); }
    }

    .hint-arrow {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.28);
      color: #ffffff;
      font-size: calc(var(--tile-font, 1.5rem) * 1.15);
      font-weight: 900;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      pointer-events: none;
      animation: arrowBounce 0.4s ease-in-out infinite alternate;
    }

    @keyframes arrowBounce {
      from { transform: scale(0.9); }
      to { transform: scale(1.15); }
    }

    /* GOAL PREVIEW OVERLAY */
    .goal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 10, 5, 0.92);
      border-radius: 10px;
      padding: var(--grid-gap);
      display: none;
      grid-template-columns: repeat(var(--grid-size), 1fr);
      grid-template-rows: repeat(var(--grid-size), 1fr);
      gap: var(--grid-gap);
      z-index: 8;
    }

    .goal-overlay.show {
      display: grid;
    }

    /* BOTTOM CONTROLS (PILL BUTTONS LIKE SCREENSHOT) */
    .bottom-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2.5vw, 16px);
      z-index: 10;
    }

    .pill-btn {
      flex: 1;
      max-width: 155px;
      height: clamp(42px, 6.2vh, 50px);
      background: var(--pill-bg);
      border: 2px solid var(--pill-border);
      border-radius: 999px;
      color: var(--pill-text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: clamp(0.9rem, 2.6vw, 1.05rem);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.25);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .pill-btn:active {
      transform: scale(0.94);
    }

    .pill-badge {
      background: rgba(255, 255, 255, 0.16);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.85em;
      color: var(--accent-color);
      font-variant-numeric: tabular-nums;
    }

    /* MODALS (DIFFICULTY, THEME, WIN) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: var(--board-frame);
      border: 2.5px solid var(--board-frame-border);
      border-radius: 18px;
      padding: 18px;
      color: var(--hud-text);
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      text-align: center;
      animation: popIn 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: var(--accent-color);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .modal-sub {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-bottom: 14px;
    }

    /* Wooden Plank Buttons for Difficulty Selection (Matching Reference) */
    .grid-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .plank-btn {
      width: 100%;
      padding: 10px 14px;
      background: var(--tile-bg);
      color: var(--tile-text);
      border-top: 2px solid var(--tile-border-top);
      border-bottom: 3px solid var(--tile-border-bottom);
      border-left: 2px solid var(--tile-border-top);
      border-right: 2px solid var(--tile-border-bottom);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    .plank-btn.active-grid {
      outline: 3px solid var(--accent-color);
    }

    .close-btn {
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 2px solid var(--pill-border);
      color: var(--pill-text);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 45;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-shell">
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="top-row">
        <div class="brand-badge">
          <span class="level-tag" id="levelDisplay">LEVEL 1</span>
          <span class="mode-badge" id="gridBadge">3×3</span>
        </div>

        <div class="icon-actions">
          <button class="icon-btn" id="btnGridModal" title="Select Difficulty Grid">⊞ Grid</button>
          <button class="icon-btn" id="btnThemeModal" title="Switch Theme">🎨 Theme</button>
          <button class="icon-btn" id="btnSound" title="Toggle Sound">🔊</button>
          <button class="icon-btn" id="btnRestart" title="Shuffle / Restart Level">🔄</button>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-box">
          <span class="stat-label">Moves</span>
          <span class="stat-value" id="movesDisplay">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="timerDisplay">00:00</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Best (<span id="bestGridLabel">3×3</span>)</span>
          <span class="stat-value" id="bestDisplay">--</span>
        </div>
      </div>
    </div>

    <!-- CENTER PUZZLE BOARD -->
    <div class="board-stage">
      <div class="board-frame" id="boardFrame">
        <div class="board-well" id="boardWell"></div>
        <div class="goal-overlay" id="goalOverlay"></div>
      </div>
    </div>

    <!-- BOTTOM PILL CONTROLS (MATCHING REFERENCE SCREENSHOT) -->
    <div class="bottom-bar">
      <button class="pill-btn" id="btnHint" title="Smart Hint">
        <span>💡</span>
        <span class="pill-badge" id="hintCount">12</span>
      </button>

      <button class="pill-btn" id="btnUndo" title="Undo Move">
        <span>↺</span>
        <span class="pill-badge" id="undoCount">10</span>
      </button>

      <button class="pill-btn" id="btnGoal" title="Preview Ordered Board">
        <span>👁️</span>
        <span>Goal</span>
      </button>
    </div>
  </div>

  <!-- DIFFICULTY / GRID SIZE MODAL -->
  <div class="modal-backdrop" id="modalGrid">
    <div class="modal-card">
      <div class="modal-title">Levels of Difficulty</div>
      <div class="modal-sub">Choose board size or continue Unlimited Campaign</div>
      <div class="grid-list" id="gridOptionsList"></div>
      <button class="close-btn" data-close="modalGrid">Close</button>
    </div>
  </div>

  <!-- THEME SWITCHER MODAL -->
  <div class="modal-backdrop" id="modalTheme">
    <div class="modal-card">
      <div class="modal-title">Visual Theme</div>
      <div class="modal-sub">Select board texture & sound profile</div>
      <div class="grid-list">
        <button class="plank-btn" data-theme-choice="wood">
          <span>🪵 Classic Wood</span>
          <span>Default</span>
        </button>
        <button class="plank-btn" data-theme-choice="neon">
          <span>⚡ Cyberpunk Neon</span>
          <span>Arcade</span>
        </button>
        <button class="plank-btn" data-theme-choice="gold">
          <span>👑 Royal Gold & Obsidian</span>
          <span>Luxury</span>
        </button>
        <button class="plank-btn" data-theme-choice="glass">
          <span>❄️ Modern Frosted Glass</span>
          <span>Clean</span>
        </button>
      </div>
      <button class="close-btn" data-close="modalTheme">Close</button>
    </div>
  </div>

  <!-- LEVEL COMPLETE MODAL -->
  <div class="modal-backdrop" id="modalWin">
    <div class="modal-card">
      <div class="modal-title" id="winTitle">LEVEL COMPLETE!</div>
      <div class="modal-sub" id="winStatsText">Solved in 24 moves (00:18)</div>
      <div class="modal-sub" style="color: var(--accent-color); font-weight: 800;">
        Reward: +2 💡 Hints & +2 ↺ Undos!
      </div>
      <div class="grid-list">
        <button class="plank-btn" id="btnNextLevel" style="justify-content:center; font-size:1.08rem;">
          ▶ Play Next Level
        </button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = 'npuzzle_deluxe_save_v1';
      const GRID_SIZES = [
        { size: 3, label: '3×3', desc: '8 Tiles • Easy' },
        { size: 4, label: '4×4', desc: '15 Tiles • Classic' },
        { size: 5, label: '5×5', desc: '24 Tiles • Medium' },
        { size: 6, label: '6×6', desc: '35 Tiles • Hard' },
        { size: 7, label: '7×7', desc: '48 Tiles • Expert' },
        { size: 8, label: '8×8', desc: '63 Tiles • Master' },
        { size: 9, label: '9×9', desc: '80 Tiles • Extreme' }
      ];

      // Persistent State
      let state = {
        level: 1,
        gridSize: 3,
        hints: 12,
        undos: 10,
        theme: 'wood',
        sound: true,
        bestScores: {}
      };

      // Active Board State
      let board = [];
      let emptyIdx = 8;
      let moveHistory = [];   // Stack for Undo button
      let solutionStack = []; // Loop-erased guaranteed path to solved board
      let stateDepthMap = new Map();
      let moves = 0;
      let seconds = 0;
      let timerInterval = null;
      let isPlaying = false;
      let hintBusy = false;

      // DOM Elements
      const boardWell = document.getElementById('boardWell');
      const goalOverlay = document.getElementById('goalOverlay');
      const levelDisplay = document.getElementById('levelDisplay');
      const gridBadge = document.getElementById('gridBadge');
      const bestGridLabel = document.getElementById('bestGridLabel');
      const movesDisplay = document.getElementById('movesDisplay');
      const timerDisplay = document.getElementById('timerDisplay');
      const bestDisplay = document.getElementById('bestDisplay');
      const hintCountEl = document.getElementById('hintCount');
      const undoCountEl = document.getElementById('undoCount');
      const btnSound = document.getElementById('btnSound');

      // Web Audio API Synthesizer
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(type) {
        if (!state.sound) return;
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        if (type === 'move') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          if (state.theme === 'neon') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(640, now + 0.065);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          } else {
            // Tactile wooden clack
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(165, now);
            osc.frequency.exponentialRampToValueAtTime(75, now + 0.055);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          }
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.075);
        } else if (type === 'hint') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.055);
            gain.gain.setValueAtTime(0.12, now + idx * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.055);
            osc.stop(now + idx * 0.055 + 0.2);
          });
        } else if (type === 'undo') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(190, now + 0.11);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.09);
            gain.gain.setValueAtTime(0.18, now + i * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.09);
            osc.stop(now + i * 0.09 + 0.26);
          });
        }
      }

      // Load & Save State
      function loadSave() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            state = { ...state, ...parsed };
          }
        } catch (e) {}
        applyTheme(state.theme);
        btnSound.textContent = state.sound ? '🔊' : '🔇';
      }

      function saveProgress() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function applyTheme(themeName) {
        state.theme = themeName;
        if (themeName === 'wood') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', themeName);
        }
        saveProgress();
      }

      // Responsive Font & Grid Variable Sizing
      function updateBoardMetrics() {
        const N = state.gridSize;
        document.documentElement.style.setProperty('--grid-size', N);
        const gap = N <= 4 ? '6px' : N <= 6 ? '4px' : '2.5px';
        const radius = N <= 4 ? '8px' : N <= 6 ? '6px' : '4px';
        document.documentElement.style.setProperty('--grid-gap', gap);
        document.documentElement.style.setProperty('--tile-radius', radius);

        const rect = boardWell.getBoundingClientRect();
        const cellPx = (rect.width || 300) / N;
        const fontPx = Math.max(11, Math.floor(cellPx * (N >= 8 ? 0.42 : 0.46)));
        document.documentElement.style.setProperty('--tile-font', `${fontPx}px`);
      }

      window.addEventListener('resize', updateBoardMetrics);

      // Record / Simplify Path to Solved State (Guarantees 100% Working Smart Hint)
      function recordStepTowardOrAwayFromSolution(previousEmptyIdx) {
        // Moving tile at current emptyIdx back to previousEmptyIdx reverses this step
        const key = board.join(',');
        if (stateDepthMap.has(key)) {
          // Loop erasure: board returned to an earlier state along the trajectory!
          const targetDepth = stateDepthMap.get(key);
          while (solutionStack.length > targetDepth) {
            const popped = solutionStack.pop();
            stateDepthMap.delete(popped.stateKeyAfter);
          }
        } else {
          solutionStack.push({
            tileToClick: previousEmptyIdx,
            stateKeyAfter: key
          });
          stateDepthMap.set(key, solutionStack.length);
        }
      }

      // Generate 100% Solvable Board via Valid Backward Moves from Solved State
      function startLevel(customGridSize = null) {
        if (customGridSize) {
          state.gridSize = customGridSize;
        }
        const N = state.gridSize;
        const total = N * N;

        // 1. Initialize in Solved State: [1, 2, ..., total-1, 0]
        board = [];
        for (let i = 1; i < total; i++) board.push(i);
        board.push(0);
        emptyIdx = total - 1;

        moveHistory = [];
        solutionStack = [];
        stateDepthMap.clear();
        const solvedKey = board.join(',');
        stateDepthMap.set(solvedKey, 0);

        // 2. Determine shuffle depth scaled by Level & Grid Size
        const baseShuffle = N * N * 2 + state.level * 5;
        const shuffleSteps = Math.min(baseShuffle, N * N * 10);

        let lastEmpty = -1;
        for (let step = 0; step < shuffleSteps; step++) {
          const neighbors = getOrthogonalNeighbors(emptyIdx, N).filter(idx => idx !== lastEmpty);
          const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
          const prevEmpty = emptyIdx;

          // Swap empty slot with picked tile
          board[emptyIdx] = board[pick];
          board[pick] = 0;
          lastEmpty = prevEmpty;
          emptyIdx = pick;

          recordStepTowardOrAwayFromSolution(prevEmpty);
        }

        // Ensure board isn't accidentally already solved
        if (isBoardSolved()) {
          const neighbors = getOrthogonalNeighbors(emptyIdx, N);
          const pick = neighbors[0];
          const prevEmpty = emptyIdx;
          board[emptyIdx] = board[pick];
          board[pick] = 0;
          emptyIdx = pick;
          recordStepTowardOrAwayFromSolution(prevEmpty);
        }

        moves = 0;
        seconds = 0;
        isPlaying = true;
        hintBusy = false;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (isPlaying) {
            seconds++;
            timerDisplay.textContent = formatTime(seconds);
          }
        }, 1000);

        updateBoardMetrics();
        renderHUD();
        renderGoalOverlay();
        renderBoard();
        saveProgress();
      }

      function getOrthogonalNeighbors(idx, N) {
        const r = Math.floor(idx / N);
        const c = idx % N;
        const list = [];
        if (r > 0) list.push((r - 1) * N + c);
        if (r < N - 1) list.push((r + 1) * N + c);
        if (c > 0) list.push(r * N + (c - 1));
        if (c < N - 1) list.push(r * N + (c + 1));
        return list;
      }

      function isBoardSolved() {
        for (let i = 0; i < board.length - 1; i++) {
          if (board[i] !== i + 1) return false;
        }
        return board[board.length - 1] === 0;
      }

      function renderHUD() {
        levelDisplay.textContent = `LEVEL ${state.level}`;
        gridBadge.textContent = `${state.gridSize}×${state.gridSize}`;
        bestGridLabel.textContent = `${state.gridSize}×${state.gridSize}`;
        movesDisplay.textContent = moves;
        timerDisplay.textContent = formatTime(seconds);
        hintCountEl.textContent = state.hints > 0 ? state.hints : '+5 Free';
        undoCountEl.textContent = state.undos > 0 ? state.undos : '+5 Free';

        const best = state.bestScores[state.gridSize];
        bestDisplay.textContent = best ? `${best.moves}m / ${formatTime(best.time)}` : '--';
      }

      function renderGoalOverlay() {
        const total = state.gridSize * state.gridSize;
        goalOverlay.innerHTML = '';
        for (let i = 1; i < total; i++) {
          const cell = document.createElement('div');
          cell.className = 'tile correct';
          cell.textContent = i;
          goalOverlay.appendChild(cell);
        }
        const empty = document.createElement('div');
        empty.className = 'tile-empty';
        goalOverlay.appendChild(empty);
      }

      function renderBoard(highlightIdx = -1, arrowSymbol = '') {
        boardWell.innerHTML = '';
        board.forEach((val, idx) => {
          if (val === 0) {
            const empty = document.createElement('div');
            empty.className = 'tile-empty';
            boardWell.appendChild(empty);
            return;
          }
          const tile = document.createElement('div');
          const isCorrect = val === idx + 1;
          tile.className = 'tile' + (isCorrect ? ' correct' : '') + (idx === highlightIdx ? ' hint-active' : '');
          tile.textContent = val;

          if (idx === highlightIdx && arrowSymbol) {
            const arrow = document.createElement('div');
            arrow.className = 'hint-arrow';
            arrow.textContent = arrowSymbol;
            tile.appendChild(arrow);
          }

          tile.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTileClick(idx);
          });
          boardWell.appendChild(tile);
        });
      }

      // Supports both Single-Tile and Multi-Tile Line Slide
      function handleTileClick(clickedIdx, isUndo = false, isHint = false) {
        if (!isPlaying || (hintBusy && !isHint)) return;
        const N = state.gridSize;
        const r1 = Math.floor(clickedIdx / N);
        const c1 = clickedIdx % N;
        const r0 = Math.floor(emptyIdx / N);
        const c0 = emptyIdx % N;

        if (r1 !== r0 && c1 !== c0) return;
        if (clickedIdx === emptyIdx) return;

        // Build path of single-tile steps from emptyIdx toward clickedIdx
        const stepIndices = [];
        if (r1 === r0) {
          const dir = c1 > c0 ? 1 : -1;
          for (let c = c0 + dir; dir > 0 ? c <= c1 : c >= c1; c += dir) {
            stepIndices.push(r0 * N + c);
          }
        } else {
          const dir = r1 > r0 ? 1 : -1;
          for (let r = r0 + dir; dir > 0 ? r <= r1 : r >= r1; r += dir) {
            stepIndices.push(r * N + c0);
          }
        }

        const previousEmptyBeforeMove = emptyIdx;

        stepIndices.forEach(targetIdx => {
          const prevEmpty = emptyIdx;
          board[emptyIdx] = board[targetIdx];
          board[targetIdx] = 0;
          emptyIdx = targetIdx;
          recordStepTowardOrAwayFromSolution(prevEmpty);
        });

        if (!isUndo) {
          moveHistory.push(previousEmptyBeforeMove);
          moves++;
          playSound('move');
        }

        renderHUD();
        renderBoard();

        if (isBoardSolved()) {
          handleLevelWin();
        }
      }

      // SMART HINT SYSTEM (Shows Directional Arrow on Tile + Auto Slides)
      function triggerHint() {
        if (!isPlaying || hintBusy) return;
        if (state.hints <= 0) {
          state.hints = 5;
          playSound('hint');
          renderHUD();
          saveProgress();
          return;
        }

        if (solutionStack.length === 0) return;

        hintBusy = true;
        state.hints--;
        playSound('hint');
        saveProgress();
        renderHUD();

        const nextStep = solutionStack[solutionStack.length - 1];
        const tileIdx = nextStep.tileToClick;

        // Calculate arrow direction from tileIdx to emptyIdx
        const N = state.gridSize;
        const tr = Math.floor(tileIdx / N), tc = tileIdx % N;
        const er = Math.floor(emptyIdx / N), ec = emptyIdx % N;
        let arrow = '←';
        if (er < tr) arrow = '↑';
        else if (er > tr) arrow = '↓';
        else if (ec > tc) arrow = '→';

        renderBoard(tileIdx, arrow);

        setTimeout(() => {
          handleTileClick(tileIdx, false, true);
          hintBusy = false;
        }, 420);
      }

      // UNDO BUTTON
      function triggerUndo() {
        if (!isPlaying || hintBusy) return;
        if (state.undos <= 0) {
          state.undos = 5;
          playSound('undo');
          renderHUD();
          saveProgress();
          return;
        }
        if (moveHistory.length === 0) return;

        const targetEmptyIdx = moveHistory.pop();
        state.undos--;
        playSound('undo');
        handleTileClick(targetEmptyIdx, true, false);
        saveProgress();
        renderHUD();
      }

      function handleLevelWin() {
        isPlaying = false;
        clearInterval(timerInterval);
        playSound('win');
        launchConfetti();

        // Save best score for current grid size
        const prevBest = state.bestScores[state.gridSize];
        if (!prevBest || moves < prevBest.moves || (moves === prevBest.moves && seconds < prevBest.time)) {
          state.bestScores[state.gridSize] = { moves, time: seconds };
        }

        const completedLevel = state.level;
        state.level++;
        state.hints += 2;
        state.undos += 2;
        saveProgress();
        renderHUD();

        document.getElementById('winTitle').textContent = `LEVEL ${completedLevel} CLEARED!`;
        document.getElementById('winStatsText').textContent =
          `Grid ${state.gridSize}×${state.gridSize} • ${moves} Moves • Time ${formatTime(seconds)}`;
        document.getElementById('modalWin').classList.add('open');
      }

      function formatTime(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      }

      // Touch Swipe & Keyboard Controls
      let touchStartX = 0, touchStartY = 0;
      boardWell.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      boardWell.addEventListener('touchend', (e) => {
        if (e.changedTouches.length === 0) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;

        const N = state.gridSize;
        const er = Math.floor(emptyIdx / N);
        const ec = emptyIdx % N;
        let targetIdx = -1;

        if (Math.abs(dx) > Math.abs(dy)) {
          // Swipe Right moves left neighbor into empty space
          if (dx > 0 && ec > 0) targetIdx = er * N + (ec - 1);
          else if (dx < 0 && ec < N - 1) targetIdx = er * N + (ec + 1);
        } else {
          if (dy > 0 && er > 0) targetIdx = (er - 1) * N + ec;
          else if (dy < 0 && er < N - 1) targetIdx = (er + 1) * N + ec;
        }
        if (targetIdx !== -1) handleTileClick(targetIdx);
      }, { passive: true });

      window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        const N = state.gridSize;
        const er = Math.floor(emptyIdx / N);
        const ec = emptyIdx % N;
        let targetIdx = -1;

        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
          if (er < N - 1) targetIdx = (er + 1) * N + ec;
        } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
          if (er > 0) targetIdx = (er - 1) * N + ec;
        } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          if (ec < N - 1) targetIdx = er * N + (ec + 1);
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          if (ec > 0) targetIdx = er * N + (ec - 1);
        }

        if (targetIdx !== -1) {
          e.preventDefault();
          handleTileClick(targetIdx);
        }
      });

      // Populate Difficulty Modal (3x3 up to 9x9)
      function populateGridModal() {
        const container = document.getElementById('gridOptionsList');
        container.innerHTML = '';
        GRID_SIZES.forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'plank-btn' + (state.gridSize === item.size ? ' active-grid' : '');
          btn.innerHTML = `<span>${item.label}</span><span style="font-size:0.82rem; opacity:0.85;">${item.desc}</span>`;
          btn.addEventListener('click', () => {
            document.getElementById('modalGrid').classList.remove('open');
            startLevel(item.size);
          });
          container.appendChild(btn);
        });
      }

      // UI Button Listeners
      document.getElementById('btnHint').addEventListener('click', triggerHint);
      document.getElementById('btnUndo').addEventListener('click', triggerUndo);

      const btnGoal = document.getElementById('btnGoal');
      btnGoal.addEventListener('pointerdown', () => goalOverlay.classList.add('show'));
      btnGoal.addEventListener('pointerup', () => goalOverlay.classList.remove('show'));
      btnGoal.addEventListener('pointerleave', () => goalOverlay.classList.remove('show'));

      document.getElementById('btnRestart').addEventListener('click', () => startLevel());
      document.getElementById('btnGridModal').addEventListener('click', () => {
        populateGridModal();
        document.getElementById('modalGrid').classList.add('open');
      });
      document.getElementById('btnThemeModal').addEventListener('click', () => {
        document.getElementById('modalTheme').classList.add('open');
      });
      btnSound.addEventListener('click', () => {
        state.sound = !state.sound;
        btnSound.textContent = state.sound ? '🔊' : '🔇';
        saveProgress();
      });

      document.querySelectorAll('[data-theme-choice]').forEach(btn => {
        btn.addEventListener('click', () => {
          applyTheme(btn.getAttribute('data-theme-choice'));
          document.getElementById('modalTheme').classList.remove('open');
        });
      });

      document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById(btn.getAttribute('data-close')).classList.remove('open');
        });
      });

      document.getElementById('btnNextLevel').addEventListener('click', () => {
        document.getElementById('modalWin').classList.remove('open');
        // Automatically step up grid difficulty every few campaign levels or stay on chosen size
        const progressiveSize = Math.min(9, 3 + Math.floor((state.level - 1) / 5));
        startLevel( Math.max(state.gridSize, progressiveSize) );
      });

      // Celebration Confetti
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      function launchConfetti() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = Array.from({ length: 70 }, () => ({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 14,
          size: Math.random() * 7 + 4,
          color: ['#ffd700', '#00f3ff', '#ff007f', '#00ff88', '#ffffff'][Math.floor(Math.random() * 5)],
          life: 65
        }));
        requestAnimationFrame(stepConfetti);
      }

      function stepConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.life--;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        particles = particles.filter(p => p.life > 0);
        if (particles.length > 0) requestAnimationFrame(stepConfetti);
      }

      // Initialize Game
      loadSave();
      startLevel();
    })();
  </script>
</body>
